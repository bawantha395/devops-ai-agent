name: Frontend CI
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'package.json', 'package-lock.json', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['apps/web/**', 'package.json', 'package-lock.json', '.github/workflows/frontend-ci.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: opspilot-web
          path: apps/web/dist


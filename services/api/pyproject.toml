[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-api"
version = "0.1.0"
description = "Development API scaffold for OpsPilot"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]


[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-agent-worker"
version = "0.1.0"
description = "Agent worker scaffold for the next project milestone"
requires-python = ">=3.12"

[project.scripts]
opspilot-worker = "opspilot_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

